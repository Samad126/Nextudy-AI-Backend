name: nextudy_backend

services:
  nextudy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextudy-api
    restart: always
    ports:
      - "3000:3000" # Expose port 3000
    depends_on:
      - postgres
    env_file:
      - .env

  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine 
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      # Persist database data to a volume
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
